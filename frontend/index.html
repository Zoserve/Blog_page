<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── Default title & meta (overridden per-page by SEO.tsx after JS loads) ─── -->
    <title>ZoServe Blog | Tech Insights &amp; Software Architecture</title>
    <meta name="description" content="Deep dives, tutorials, and strategic insights on software engineering, cloud architecture, and AI from ZoServe's senior engineers." />

    <!-- ─── Default Open Graph (visible to social crawlers before JS runs) ─── -->
    <meta property="og:site_name" content="ZoServe Blog" />
    <meta property="og:title" content="ZoServe Blog | Tech Insights &amp; Software Architecture" />
    <meta property="og:description" content="Deep dives, tutorials, and strategic insights on software engineering, cloud architecture, and AI from ZoServe's senior engineers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blog.zoserve.com" />
    <meta property="og:image" content="https://blog.zoserve.com/og-default.png" />

    <!-- ─── Default Twitter Card ─── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZoServe Blog | Tech Insights &amp; Software Architecture" />
    <meta name="twitter:description" content="Deep dives, tutorials, and strategic insights from ZoServe's senior engineers." />
    <meta name="twitter:image" content="https://blog.zoserve.com/og-default.png" />

    <!-- ─── Google Fonts: preconnect + stylesheet (NOT @import, so non-blocking) ─── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
